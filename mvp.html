<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Волен · MVP: главная, ски-пасс, парковка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3f5; --ink:#21201f; --mute:#73726e; --line:#e8e8e6;
  --blue:#1677ff; --gold:#ffcc00; --go:#118c4f; --hot:#e8572a;
  --ui:"Golos Text",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ui);background:#dcdfe4;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}button{cursor:pointer;border:0;background:none}
.page{display:grid;grid-template-columns:minmax(420px,470px) 1fr;min-height:100vh}
.stage{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px 8px;background:#cfd4db}
.kicker{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.stage h1{font-size:18px;text-align:center;letter-spacing:-.03em}
.sp{font-size:12px;color:#5c6168;text-align:center;max-width:380px;line-height:1.45}
.scenarios{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:400px}
.scenarios button{font-size:11px;padding:7px 10px;border-radius:999px;background:#fff;font-weight:700;border:1px solid #d5d8de}
.phone{width:390px;height:844px;background:#1a1a1a;border-radius:46px;padding:10px;box-shadow:0 24px 70px #0004}
.phone-inner{width:100%;height:100%;border-radius:36px;overflow:hidden;position:relative;background:var(--bg)}
.homebar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:120px;height:4px;background:#111;border-radius:4px;opacity:.4;z-index:60}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.status{height:46px;padding:12px 24px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.body{flex:1;overflow:auto;padding:0 16px 88px}
.body::-webkit-scrollbar{width:0}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;padding:6px 8px 16px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:20}
.tabbar button{color:#8b8a86;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--blue)}
.h1{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1.15}
.sub{font-size:14px;color:var(--mute);margin-top:6px;line-height:1.45}
.hero{margin:8px 0 18px}
.brand{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--blue);margin-bottom:8px}
.btn{height:52px;width:100%;border-radius:16px;font-weight:800;font-size:16px}
.btn-b{background:var(--blue);color:#fff}
.btn-y{background:var(--gold);color:#111}
.btn-w{background:#fff;border:1px solid var(--line)}
.btn-more{background:#e8f1ff;color:var(--blue)}
.field{background:#fff;border:1px solid var(--line);border-radius:14px;height:52px;display:flex;align-items:center;padding:0 14px;margin:8px 0;gap:8px}
.field span{font-size:12px;font-weight:700;color:var(--mute);width:52px}
.field input{border:0;outline:0;flex:1;font-size:16px;font-weight:700;background:transparent;width:100%}
.otp{display:flex;gap:8px;justify-content:center;margin:20px 0}
.otp input{width:56px;height:64px;border-radius:14px;border:1px solid var(--line);text-align:center;font-size:24px;font-weight:800;background:#fff}
.hint{font-size:12px;color:var(--mute);line-height:1.4;margin-top:10px}
.ok{color:var(--go);font-weight:700}.warn{color:var(--hot);font-weight:700}
.wallet{background:linear-gradient(160deg,#1677ff 0%,#0f5fd6 55%,#0a4bb0 100%);color:#fff;border-radius:22px;padding:18px 18px 16px;margin:8px 0 12px;position:relative;overflow:hidden}
.wallet:before{content:"";position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:#fff2}
.wallet .k{font-size:12px;opacity:.85;font-weight:700}
.wallet .sum{font-size:32px;font-weight:800;margin:8px 0 4px;letter-spacing:-.04em}
.wallet .row2{display:flex;justify-content:space-between;font-size:13px;opacity:.95}
.p-wallet{background:linear-gradient(160deg,#21201f,#3a3936)}
.amt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.amt button{height:48px;border-radius:14px;background:#fff;font-weight:800;border:1px solid var(--line)}
.amt button.on{background:var(--gold);border-color:var(--gold)}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:8px;box-shadow:0 1px 3px #0000000c;width:100%;text-align:left}
.card b{display:block;font-size:15px}
.meta{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.35}
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.box{background:#fff;border-radius:16px;padding:14px;margin:8px 0;box-shadow:0 1px 2px #0000000a}
.back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;margin:2px 0 12px;color:var(--blue)}
.tx{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.tx:last-child{border:0}
.sheet{position:absolute;inset:0;background:#0005;z-index:40;display:flex;align-items:flex-end}
.panel{background:#fff;border-radius:22px 22px 0 0;padding:10px 16px 28px;width:100%}

.payhead{height:120px;border-radius:16px;background:#f6f7f8;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:12px}

.link{color:var(--blue);font-weight:700;font-size:13px;margin-top:12px}
.api{font-family:ui-monospace,Menlo,monospace;font-size:9px;font-weight:700;padding:5px 7px;border-radius:8px;margin:0 0 10px;background:#e7f6ee;color:#0d6a3c;word-break:break-all}
.docs{padding:20px 36px 80px;max-width:880px}
.docs h2{font-size:24px;margin-bottom:8px}.docs h3{margin:22px 0 8px;font-size:16px}
.docs p,.docs li{font-size:14px;line-height:1.55;color:#3a3a38}

.docs ul,.docs ol{padding-left:18px}
.docs code{font-size:12px;background:#f3f3f1;padding:1px 5px;border-radius:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.tbl th,.tbl td{border:1px solid #e4e4e1;padding:8px;text-align:left;vertical-align:top}
.tbl th{background:#f6f6f4}
.money{background:#fff;border-radius:16px;padding:14px 16px;margin:12px 0;border:1px solid #e8e8e6}
.money .big{font-size:28px;font-weight:800;letter-spacing:-.04em}
.topbar{padding:16px 36px 0}
.tabs{display:flex;gap:4px;background:#fff;padding:4px;border-radius:12px;width:fit-content;flex-wrap:wrap}
.tabs button{padding:8px 12px;border-radius:9px;font-weight:700;font-size:13px;color:#7a7975}
.tabs button.on{background:#21201f;color:#fff}

.tophead{display:flex;justify-content:space-between;align-items:center;padding:4px 0 12px}
.logo{font-size:13px;font-weight:800;letter-spacing:.18em;color:var(--blue)}
.pill{height:32px;padding:0 12px;border-radius:999px;background:#fff;font-size:12px;font-weight:700;border:1px solid var(--line)}
.toggle{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:14px;padding:4px;margin-bottom:14px;box-shadow:0 1px 2px #0000000a}
.toggle button{height:40px;border-radius:11px;font-weight:800;font-size:14px;color:#7a7975}
.toggle button.on{background:#21201f;color:#fff}
.wx{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wx .deg{font-size:28px;font-weight:800;letter-spacing:-.04em}
.act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border-radius:20px;padding:16px;margin-bottom:10px;box-shadow:0 1px 3px #0000000c}
.act .ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.act .ico svg{width:26px;height:26px}
.act.skip .ico{background:#e8f1ff;color:var(--blue)}
.act.park .ico{background:#21201f;color:#ffcc00}
.act b{display:block;font-size:17px;font-weight:800}
.act span{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.act .chev{margin-left:auto;color:#c4c3bf;font-size:22px;font-weight:400}
.guest{background:#fff8dc;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.4;margin:10px 0}
.guest b{display:block;margin-bottom:2px}
.hero-photo{position:relative;height:176px;border-radius:20px;overflow:hidden;margin:0 0 12px;background:#cfd4db}
.hero-photo img{width:100%;height:100%;object-fit:cover;display:block}
.hero-photo .veil{position:absolute;inset:0;background:linear-gradient(180deg,#0000 30%,#000a)}
.hero-photo .cap{position:absolute;left:14px;right:14px;bottom:12px;color:#fff}
.hero-photo .cap em{font-style:normal;font-size:11px;font-weight:800;opacity:.9}
.hero-photo .cap b{display:block;font-size:22px;letter-spacing:-.04em;margin-top:2px}
.facts{display:flex;gap:6px;margin:0 0 12px;overflow:auto}
.facts::-webkit-scrollbar{height:0}
.facts i{flex:none;background:#fff;padding:8px 11px;border-radius:12px;font-style:normal;font-size:12px;font-weight:800;box-shadow:0 1px 2px #0000000a}
.facts i small{display:block;font-size:10px;font-weight:600;color:var(--mute)}
.sec-l{font-size:13px;font-weight:800;margin:16px 4px 8px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.quick button{background:#fff;border-radius:16px;padding:12px;text-align:left;box-shadow:0 1px 2px #0000000a}
.quick b{display:block;font-size:13px}
.quick span{display:block;font-size:11px;color:var(--mute);margin-top:3px;line-height:1.3}
.photos{display:flex;gap:8px;overflow:auto;margin:4px 0 8px}
.photos::-webkit-scrollbar{height:0}
.photos img{width:148px;height:92px;object-fit:cover;border-radius:14px;flex:none}
.mitem{display:flex;width:100%;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:700;text-align:left}
.mitem:last-child{border:0}
.mitem span{color:var(--mute);font-weight:500;font-size:13px}
.avatar{width:64px;height:64px;border-radius:22px;background:var(--gold);color:#111;display:grid;place-items:center;font-size:22px;font-weight:800;flex:none;position:relative;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .cam{position:absolute;right:4px;bottom:4px;width:22px;height:22px;border-radius:8px;background:#21201f;color:#fff;font-size:11px;display:grid;place-items:center}
.pcard{border-radius:20px;padding:16px;color:#fff;margin-bottom:8px;text-align:left;width:100%;position:relative;overflow:hidden}
.pcard .k{font-size:12px;opacity:.85;font-weight:700}
.pcard .sum{font-size:26px;font-weight:800;margin:6px 0 2px;letter-spacing:-.04em}
.pcard .row2{display:flex;justify-content:space-between;font-size:13px;opacity:.95}
.pcard.s{background:linear-gradient(160deg,#1677ff,#0a4bb0)}
.pcard.p{background:linear-gradient(160deg,#21201f,#3a3936)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.grid3 button{aspect-ratio:1;border-radius:16px;overflow:hidden;background:#fff;border:3px solid transparent}
.grid3 button.on{border-color:var(--gold)}
.grid3 img{width:100%;height:100%;object-fit:cover;display:block}
.prof{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:16px;margin:8px 0 12px;box-shadow:0 1px 3px #0000000c;text-align:left;width:100%}
.prof .nm{font-size:18px;font-weight:800;letter-spacing:-.03em}
.mini{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:16px;padding:14px;margin-bottom:8px;box-shadow:0 1px 2px #0000000a}
.mini .icw{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.mini .icw svg{width:22px;height:22px}
.mini.skip .icw{background:#e8f1ff;color:var(--blue)}
.mini.park .icw{background:#21201f;color:var(--gold)}
.mini .chev{margin-left:auto;color:#c4c3bf;font-size:22px;font-weight:400}
.tx small{display:block;color:var(--mute);font-size:11px;font-weight:500;margin-top:2px}
.lock{width:64px;height:64px;border-radius:20px;background:#fff1ed;color:var(--hot);display:grid;place-items:center;font-size:28px;margin:18px auto 12px;font-weight:800}
@media(max-width:980px){.page{grid-template-columns:1fr}.stage{position:relative;height:auto}}
</style>
</head>
<body>
<div class="page">
  <aside class="stage">
    <div class="kicker">MVP · главная · вход по желанию</div>
    <h1>Главная · ски-пасс · парковка</h1>
    <p class="sp">Вход по желанию. OTP макета — 1426. Ски-пасс: 40013838, парковка: E0040539. PIN нет — только длина номера и лимит попыток.</p>
    <div class="scenarios">
      <button onclick="run('home')">Главная</button>
      <button onclick="run('step')">Степаново</button>
      <button onclick="run('way')">Как доехать</button>
      <button onclick="run('you')">Профиль</button>
      <button onclick="run('name')">Имя</button>
      <button onclick="run('photo')">Фото</button>
      <button onclick="run('hist')">История</button>
      <button onclick="run('lock')">Защита от перебора</button>
      <button onclick="run('phone')">Телефон</button>
      <button onclick="run('otp-new')">OTP · новый</button>
      <button onclick="run('otp-old')">OTP · есть в базе</button>
      <button onclick="run('skip-guest')">Ски-пасс гость</button>
      <button onclick="run('skipass')">Ски-пасс вошёл</button>
      <button onclick="run('parking')">Парковка</button>
      <button onclick="run('paid')">Успех оплаты</button>
    </div>
    <div class="phone"><div class="phone-inner" id="app"></div><div class="homebar"></div></div>
  </aside>
  <main>
    <div class="topbar"><div class="tabs">
      <button class="on" id="t-tz" onclick="showDoc('tz')">ТЗ</button>
      <button id="t-api" onclick="showDoc('api')">Ручки</button>
      <button id="t-est" onclick="showDoc('est')">Сроки и деньги</button>
    </div></div>
    <article class="docs" id="doc"></article>
  </main>
</div>
<script>
const IMG={
  volen:"https://images.unsplash.com/photo-1605540436563-5bca91957098?auto=format&fit=crop&w=1000&q=70",
  step:"https://images.unsplash.com/photo-1551698618-1dfe5d97d256?auto=format&fit=crop&w=1000&q=70",
  night:"https://images.unsplash.com/photo-1418985991508-e47386d96a71?auto=format&fit=crop&w=800&q=70",
  lot:"https://images.unsplash.com/photo-1506521781263-d8422e82f27a?auto=format&fit=crop&w=800&q=70",
  lodge:"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=70"
};
const PHONE_PARK="+7 495 161-61-30";
const KNOWN="79012883641";
const ic={
  home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>`,
  skip:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="9" cy="12" r="2"/></svg>`,
  park:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19V7a2 2 0 0 1 2-2h7a5 5 0 0 1 0 10H7"/><path d="M5 19h14"/></svg>`,
  user:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 19a7 7 0 0 1 14 0"/></svg>`
};
const AV=[
  "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=400&q=70",
  "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=70",
  "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=400&q=70",
  "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=400&q=70",
  "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=400&q=70",
  "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=70"
];
const state={
  tab:"home", view:null, sheet:null, auth:null, isNew:false,
  user:null, phone:"+7 (901) 288-36-41", code:"", demo:"1426",
  first:"Иван", last:"Гость", photo:null, pick:null,
  resort:"volen", amount:3000, guestSkip:null, guestPark:null,
  skip:{id:"12", masked:"4001 ···· 3838", rub:3240, bonus:1180},
  park:{id:"p2", masked:"E004 ···· 0539", rub:400, park:"Волен"},
  fails:0, lockUntil:0, txShown:{skip:3,park:3}
};
const CARD={skip:"40013838",park:"e0040539"};
const TX={
  skip:[
    {t:"Турникет Волен, 1А",d:"31 авг, 11:20",n:-70},
    {t:"Пополнение",d:"30 авг, 18:04",n:3000},
    {t:"Касса, разовый",d:"30 авг, 10:12",n:-1200},
    {t:"Турникет Степаново",d:"29 авг, 16:40",n:-90},
    {t:"Турникет Волен, 3",d:"29 авг, 14:05",n:-70},
    {t:"Пополнение",d:"24 авг, 09:18",n:1500},
    {t:"Касса, безлимит 24",d:"23 авг, 12:00",n:-4990},
    {t:"Турникет Волен, 1Б",d:"22 авг, 13:31",n:-70}
  ],
  park:[
    {t:"Выезд, Волен",d:"31 авг, 19:10",n:-300},
    {t:"Пополнение",d:"31 авг, 09:02",n:400},
    {t:"Выезд, Степаново",d:"24 авг, 20:15",n:-400},
    {t:"Пополнение",d:"20 авг, 11:40",n:600}
  ]
};
function digits(){return state.phone.replace(/\D/g,"")}
function uname(){return `${state.first||""} ${state.last||""}`.trim()||"Гость"}
function rname(){return state.resort==="volen"?"Волен":"Степаново"}
function mask(v){const d=v.replace(/\D/g,"").slice(0,11);const r=d.startsWith("7")?d.slice(1):d;let o="+7";if(r.length)o+=" ("+r.slice(0,3);if(r.length>=3)o+=") "+r.slice(3,6);if(r.length>=6)o+="-"+r.slice(6,8);if(r.length>=8)o+="-"+r.slice(8,10);return o}
function rub(n){return n.toLocaleString("ru-RU")+" ₽"}
function toast(m){const t=document.createElement("div");t.textContent=m;Object.assign(t.style,{position:"fixed",bottom:"22px",left:"50%",transform:"translateX(-50%)",background:"#21201f",color:"#fff",padding:"10px 14px",borderRadius:"12px",zIndex:99,fontSize:"13px",fontWeight:"800"});document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function hasSkip(){return !!(state.user||state.guestSkip)}
function hasPark(){return !!(state.user||state.guestPark)}

function tabbar(){
  const items=[["home","Главная",ic.home],["skip","Ски-пасс",ic.skip],["park","Парковка",ic.park],["you","Профиль",ic.user]];
  return `<nav class="tabbar">${items.map(([id,l,s])=>`<button class="${state.tab===id&&!state.view&&!state.auth?"on":""}" onclick="go('${id}')">${s}${l}</button>`).join("")}</nav>`;
}
function tog(){
  return `<div class="toggle">
    <button class="${state.resort==="volen"?"on":""}" onclick="state.resort='volen';render()">Волен</button>
    <button class="${state.resort==="step"?"on":""}" onclick="state.resort='step';render()">Степаново</button>
  </div>`;
}
function skipInfo(){
  return `<div class="sec-l">Как устроен ски-пасс</div>
    <div class="box">
      <div class="row"><span>Парки</span><b>Волен и Степаново</b></div>
      <div class="row"><span>Карта-носитель</span><b>100 ₽</b></div>
      <div class="row"><span>Тайм-аут</span><b>${state.resort==="volen"?"2 мин":"5 мин"}</b></div>
      <div class="row"><span>Разовый, будни</span><b>от 70 ₽</b></div>
    </div>
    <p class="hint">Карту выдают в кассе. Потерянную не восстанавливают.</p>`;
}

function saveName(){
  const f=(document.getElementById("fn")||{}).value||"";
  const l=(document.getElementById("ln")||{}).value||"";
  if(!f.trim()){toast("Введите имя");return}
  state.first=f.trim();state.last=l.trim();
  if(state.user) state.user.name=uname();
  state.view=null;toast("Сохранено");render();
}
function savePhoto(){
  if(!state.pick){toast("Выберите фото");return}
  state.photo=state.pick;state.view=null;toast("Фото обновлено");render();
}
function sheets(){
  if(state.sheet!=="pay") return "";
  return `<div class="sheet" onclick="if(event.target===this){state.sheet=null;render()}">

      <div class="handle"></div>

}
function render(){
  let main;
  if(state.auth) main=screenAuth();

  else if(state.tab==="park") main=screenPark();
  else main=screenYou();
  document.getElementById("app").innerHTML=`<div class="app"><div class="status"><span>16:21</span><span>LTE  84%</span></div><div class="body">${main}</div>${tabbar()}${sheets()}</div>`;
  if(state.auth==="otp"){const a=document.getElementById("c0");if(a)a.focus()}
}
function go(t){state.tab=t;state.view=null;state.sheet=null;state.auth=null;state.txShown={skip:3,park:3};render()}
function openAuth(){state.auth="phone";state.code="";render()}
function logout(){state.user=null;state.auth=null;state.tab="home";toast("Вышли · карты гостя на месте");render()}
function sendOtp(){
  if(digits().length<11){toast("Введите телефон");return}
  state.isNew=digits()!==KNOWN;
  state.auth="otp";state.code="";
  toast(state.isNew?"Номера нет — создадим кабинет":"Номер найден — вход");
  render();
}
function otp(i){const el=document.getElementById("c"+i);el.value=(el.value||"").replace(/\D/g,"").slice(-1);state.code=[0,1,2,3].map(n=>(document.getElementById("c"+n).value||"")).join("");if(el.value&&i<3)document.getElementById("c"+(i+1)).focus();if(state.code.length===4)verify()}
function verify(){
  if(state.code!==state.demo){toast("Код "+state.demo);return}
  if(state.isNew){state.first="Новый";state.last="Гость"}
  state.user={name:uname(),phone:state.phone,fresh:state.isNew};
  state.auth=null;
  toast(state.isNew?"Кабинет создан":"С возвращением");
  if(state.tab==="you"||state.tab==="home") {/* stay */}
  render();
}
function bindGuest(kind){tryCard(kind)}
function tryCard(kind){
  if(locked()){state.view="lock";render();return}
  const raw=((document.getElementById("cnum")||{}).value||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  if(raw.length<8||raw.length>16){toast("Номер 8–16 знаков");return}
  if(raw!==CARD[kind]){
    state.fails+=1;
    if(state.fails>=3){state.lockUntil=Date.now()+15*60*1000;state.view="lock";toast("Пауза 15 минут");render();return}
    toast("Карта не найдена");render();return
  }
  state.fails=0;
  const mask=raw.slice(0,4).toUpperCase()+" ···· "+raw.slice(-4);
  if(kind==="skip"){state.guestSkip=true;state.skip.masked=mask}
  else {state.guestPark=true;state.park.masked=mask;state.park.park=rname()}
  state.view=null;
  toast("Карта найдена");render();
}
function startPay(){if(!state.amount){toast("Сумма");return}state.sheet="pay";render()}
function finishPay(){
  state.sheet=null;
  if(state.tab==="park") state.park.rub+=state.amount; else state.skip.rub+=state.amount;
  state.view="paid";render();
}
function run(s){
  state.sheet=null;state.view=null;state.auth=null;
  if(s==="home"){state.user=null;state.tab="home";state.resort="volen";state.guestSkip=null;state.guestPark=null;state.fails=0;state.lockUntil=0}
  if(s==="step"){state.tab="home";state.resort="step"}
  if(s==="way"){state.tab="home";state.view="way"}
  if(s==="you"){state.user={name:uname(),phone:"+7 (901) 288-36-41"};state.tab="you";state.guestSkip=true;state.guestPark=true}
  if(s==="name"){state.user={name:uname(),phone:"+7 (901) 288-36-41"};state.tab="you";state.view="name"}
  if(s==="photo"){state.user={name:uname(),phone:"+7 (901) 288-36-41"};state.tab="you";state.view="photo";state.pick=state.photo}
  if(s==="hist"){state.user={name:uname(),phone:"+7 (901) 288-36-41"};state.tab="skip";state.view="hist";state.guestSkip=true}
  if(s==="lock"){state.user=null;state.tab="skip";state.guestSkip=null;state.fails=3;state.lockUntil=Date.now()+15*60*1000;state.view="lock"}
  if(s==="phone"){state.user=null;state.auth="phone";state.tab="you"}
  if(s==="otp-new"){state.user=null;state.phone="+7 (903) 111-22-33";state.isNew=true;state.auth="otp";state.code="";state.tab="you"}
  if(s==="otp-old"){state.user=null;state.phone="+7 (901) 288-36-41";state.isNew=false;state.auth="otp";state.code="";state.tab="you"}
  if(s==="skip-guest"){state.user=null;state.tab="skip";state.view=null;state.guestSkip=null;state.fails=0;state.lockUntil=0}
  if(s==="skipass"){state.user={name:"Иван Гость",phone:"+7 (901) 288-36-41"};state.tab="skip"}
  if(s==="parking"){state.tab="park";state.view=null}
  if(s==="paid"){state.tab="skip";state.amount=3000;state.view="paid";state.guestSkip=true}
  render();
}

    <li>Нижнее меню всегда: Главная · Ски-пасс · Парковка · Профиль. В шапке главной нет бейджа телефона — кабинет во вкладке Профиль.</li>
  </ol>
  <h3>2. Авторизация = регистрация, один UX</h3>
  <ol>
    <li>Не обязательна. Гость смотрит главную, вводит номер карты, пополняет.</li>
    <li>Один экран «Телефон». Нет отдельных «вход» и «регистрация», нет пароля.</li>
    <li>Клиент шлёт <code>POST /v1/auth/otp/request { phone }</code>. Сервер ищет номер в базе (~67 тыс. старых пользователей).</li>
    <li>Номер есть — OTP и вход. Номера нет — OTP, после кода создаём пользователя и сразу сессию.</li>
    <li>На экране кода пользователь видит, новый это номер или нет (копия: «создадим кабинет» / «войдёте»).</li>
    <li>Канал: звонок, запасной SMS. Код 4 цифры. В макете 1426.</li>
    <li>Сессия: access + refresh JWT. Выход чистит токены, гостевые карты на устройстве можно оставить.</li>
    <li>На каждом шаге — «продолжить без входа».</li>
  </ol>
  <p>Сверка со старыми учётками — по телефону. Пароль md5 из /mobile для этого флоу не нужен. E-mail не делаем.</p>
  <h3>3. Пополнение ски-пасса</h3>
  <ol>
    <li>Гость: номер карты 8–16 знаков → lookup. PIN в этой версии нет.</li>
    <li>После входа: список привязанных карт. Гостевую карту, если была, привязываем к user_id.</li>
    <li>Баланс RUB и бонус из SPD (порт 55557), только с сервера Волена.</li>
    <li>Пополнение: сумма → платёж → in-app browser → webhook → replenishmentCard → paid → обновить баланс.</li>
    <li>История: на карточке 3 последние, кнопка «Показать ещё» открывает экран «История транзакций» с возвратом на ски-пасс / парковку.</li>
    <li>Таймаут SPD — не показывать 0 ₽ как успех.</li>
  </ol>
  <h3>4. Парковка</h3>
  <ol>
    <li>Те же сценарии, что ски-пасс: длина номера, лимит попыток, история выездов, «Показать ещё».</li>
    <li>type_id=2, порты 55558 Волен и 55560 Степаново. Текущий парк с тумблера главной.</li>
    <li>Госномер как поле въезда — <b>не входит</b>. Тариф «15 минут» показываем текстом, сессию въезда не считаем.</li>
  </ol>
  <h3>5. Защита от перебора номеров</h3>
  <ol>
    <li>PIN пока не делаем. Номер: 8–16 символов, maxlength на поле, лишние знаки обрезаем.</li>
    <li>3 неудачи с устройства — пауза 15 минут. Экран блокировки.</li>
    <li>На BFF: лимит на IP и device-id, в ответе только маска и баланс, один текст «карта не найдена».</li>
  </ol>
  <h3>6. Профиль</h3>
  <ol>
    <li>Имя и фамилия — отдельный экран, <code>PATCH /v1/me</code>.</li>
    <li>Фото — отдельный экран: пресеты, камера, галерея. Загрузка файла на BFF.</li>
    <li>Карты в профиле — как кошельки: ски-пасс синий, парковка тёмная, баланс крупно.</li>
  </ol>
  <h3>Не делать в этом MVP</h3>
  <ul>
    <li>Пароль, отдельная регистрация, e-mail.</li>
    <li>WebView /mobile как каркас.</li>
    <li>Камеры, инструкторы, график, отель, карта курорта, пуши.</li>
    <li>Прямой SPD с телефона. Публичный users?method=filter.</li>
  </ul>
  <h3>Приёмка</h3>
  <ul>
    <li>Холодный старт открывает главную, без экрана логина.</li>
    <li>Тумблер меняет парк на главной и подпись порта парковки.</li>
    <li>Известный телефон: после OTP — «с возвращением», карты кабинета.</li>
    <li>Новый телефон: после OTP — пользователь в базе и сессия.</li>
    <li>Гость вводит номер карты, видит баланс, тестовое пополнение доходит.</li>
    <li>После входа гостевая карта видна в кабинете.</li>
  </ul>

api:`
  <h2>ТЗ на API v1</h2>
  <p class="lead">Полный контракт: файл <code>tz-api.html</code> и Word <code>ТЗ-API-v1-Волен.docx</code> (для Google Docs). Ниже — оглавление ручек. Клиент не ходит в /mobile/api.</p>
  <p><b>База</b> <code>https://www.volen.ru/v1</code>. JSON, целые рубли, <code>X-Device-Id</code>, ошибки <code>{ error: { code, message } }</code>. SPD только с сервера: 55557 / 55558 / 55560.</p>
  <table class="tbl">
    <tr><th>Ручка</th><th>Кто</th><th>Смысл</th></tr>
    <tr><td><code>POST /v1/auth/otp/request</code></td><td>гость</td><td>phone → exists, звонок/SMS, retry_after</td></tr>
    <tr><td><code>POST /v1/auth/otp/verify</code></td><td>гость</td><td>код → JWT; нет user — создать</td></tr>
    <tr><td><code>POST /v1/auth/refresh</code></td><td>—</td><td>новая пара, rotation</td></tr>
    <tr><td><code>POST /v1/auth/logout</code></td><td>сессия</td><td>сжечь refresh</td></tr>
    <tr><td><code>GET /v1/me</code></td><td>сессия</td><td>id, phone, имя, фото</td></tr>
    <tr><td><code>PATCH /v1/me</code></td><td>сессия</td><td>first_name, last_name</td></tr>
    <tr><td><code>POST /v1/me/photo</code></td><td>сессия</td><td>multipart jpeg/png</td></tr>
    <tr><td><code>GET /v1/home</code></td><td>гость</td><td>resort, часы, сезон, превью карт</td></tr>
    <tr><td><code>GET /v1/skipasses/lookup</code></td><td>гость</td><td>number 8–16; 404 / 429 после 3</td></tr>
    <tr><td><code>POST /v1/skipasses</code></td><td>оба</td><td>привязка; с JWT — к user</td></tr>
    <tr><td><code>GET /v1/skipasses</code></td><td>сессия</td><td>список карт кабинета</td></tr>
    <tr><td><code>GET /v1/skipasses/{id}</code></td><td>оба</td><td>карточка</td></tr>
    <tr><td><code>GET …/balance</code></td><td>оба</td><td>SPD getBalance, не 0 при таймауте</td></tr>
    <tr><td><code>GET …/transactions</code></td><td>оба</td><td>история, page, has_more</td></tr>
    <tr><td><code>/v1/parking-cards…</code></td><td>как ски-пасс</td><td>type_id=2, park, порты 55558/55560</td></tr>
    <tr><td><code>POST /v1/payments</code></td><td>оба</td><td>card_id, amount, purpose → payment_url</td></tr>
    <tr><td><code>GET /v1/payments/{id}</code></td><td>оба</td><td>pending | paid | failed</td></tr>
    <tr><td><code>POST /v1/payments/webhook</code></td><td>платёжка</td><td>не клиент; replenishmentCard</td></tr>
  </table>
  <p>Закрыть <code>users?method=filter</code>. Приёмка и примеры JSON — в <code>tz-api.html</code>.</p>
